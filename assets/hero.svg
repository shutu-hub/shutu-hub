      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1B2740" stroke-width="1"/>
    </pattern>
    <clipPath id="h-card"><rect x="0" y="0" width="860" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#h-card)">
