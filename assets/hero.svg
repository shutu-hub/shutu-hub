    </circle>
    <text x="76" y="60.5" font-size="12" fill="#9FE8FF">~/shutu-hub</text>
  </g>

  <text x="42" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#h-name)">shutu-hub</text>

  <text x="44" y="186" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#9AA8BF">Java 后端 &#183; 实时通信 &#183; 全栈开发 &#183; LLM 应用</text>

  <line x1="44" y1="212" x2="392" y2="212" stroke="#1C2942"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#6B7A93">
