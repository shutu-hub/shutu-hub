  <g>
    <rect x="452" y="52" width="364" height="196" rx="14" fill="#0A111F" stroke="#20304C"/>
    <rect x="452" y="52" width="364" height="196" rx="14" fill="url(#h-glowA)" opacity="0.35"/>
    <circle cx="478" cy="76" r="4.5" fill="#FF5F57"/>
    <circle cx="494" cy="76" r="4.5" fill="#FEBC2E"/>
    <circle cx="510" cy="76" r="4.5" fill="#28C840"/>
    <text x="800" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5A6982">zsh</text>
    <line x1="452" y1="94" x2="816" y2="94" stroke="#17233A"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="476" y="126"><tspan fill="#34D399">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
      <text x="800" y="126" text-anchor="end" fill="#8B98B0">shutu-hub</text>

      <text x="476" y="156"><tspan fill="#34D399">$</tspan><tspan fill="#E6EDF3"> focus</tspan></text>
      <text x="800" y="156" text-anchor="end" fill="#8B98B0">实时通信 &#183; 微服务</text>

      <text x="476" y="186"><tspan fill="#34D399">$</tspan><tspan fill="#E6EDF3"> stack</tspan></text>
      <text x="800" y="186" text-anchor="end" fill="#8B98B0">Java &#183; Vue &#183; Python</text>

      <text x="476" y="222" fill="#34D399">$</text>
