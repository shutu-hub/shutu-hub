    <circle cx="430" cy="290" r="200" fill="url(#h-glowC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="716" cy="46" r="118" fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="716" cy="46" r="176" fill="none" stroke="#A78BFA" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <rect x="0.5" y="0.5" width="859" height="299" rx="18" fill="none" stroke="#22304D"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
