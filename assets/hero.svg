<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="shutu-hub profile header">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="52%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="h-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="h-glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glowB" cx="0.5" cy="0.5" r="0.5">
