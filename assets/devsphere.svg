<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
  <title id="title">devSphere realtime communication</title>
  <desc id="desc">A dark blue network illustration for the devSphere project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="210" rx="18" fill="url(#bg)"/>
  <circle cx="650" cy="26" r="150" fill="#38bdf8" opacity=".08"/>
  <circle cx="92" cy="190" r="130" fill="#818cf8" opacity=".08"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".3" stroke-width="2">
    <path d="M520 64 610 112 680 67M610 112l-18 55m18-55 77 46M520 64l-10 97 82 6m88-100 7 91"/>
  </g>
  <g fill="#0f172a" stroke="url(#accent)" stroke-width="3" filter="url(#glow)">
    <circle cx="520" cy="64" r="9"/><circle cx="610" cy="112" r="12"/><circle cx="680" cy="67" r="9"/>
    <circle cx="592" cy="167" r="9"/><circle cx="687" cy="158" r="10"/><circle cx="510" cy="161" r="8"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#fff">
    <text x="42" y="66" font-size="15" letter-spacing="3" fill="#a5b4fc">01 / REAL-TIME COMMUNICATION</text>
    <text x="42" y="112" font-size="36" font-weight="700">devSphere</text>
    <text x="44" y="143" font-size="16" fill="#cbd5e1">Private chat · Group chat · Offline messages</text>
    <rect x="44" y="166" width="8" height="8" rx="4" fill="#38bdf8"/>
    <text x="62" y="174" font-size="13" fill="#bae6fd">Spring Boot  /  Netty  /  Redis</text>
